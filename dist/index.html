<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个安静、快捷、数据留在本机的个人导航主页。" />
    <meta name="color-scheme" content="dark" />
    <title>栖点 · 个人导航</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2309141d'/%3E%3Cpath d='M17 20h30L33 46l-5-14z' fill='%235eead4'/%3E%3Ccircle cx='40' cy='24' r='5' fill='%23e8fffb'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="栖点首页">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span>栖点</span>
      </a>
      <div class="top-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换主题">
          <span aria-hidden="true">◐</span>
        </button>
        <button class="add-button" id="addButton" type="button">
          <span aria-hidden="true">＋</span> 添加链接
        </button>
      </div>
    </header>

    <main class="shell">
      <section class="intro" aria-labelledby="greeting">
        <div>
          <p class="eyebrow" id="dateText">今天</p>
          <h1 id="greeting">下午好，去想去的地方。</h1>
        </div>
        <div class="connection" id="connectionState" role="status">
          <span class="pulse"></span>
          <span>正在连接本机数据</span>
        </div>
      </section>

      <section class="search-wrap" aria-label="搜索导航">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索收藏，或输入网址…" autocomplete="off" aria-label="搜索收藏" />
        <kbd>⌘ K</kbd>
      </section>

      <nav class="filters" id="filters" aria-label="分类筛选">
        <button class="filter active" type="button" data-category="全部">全部</button>
      </nav>

      <section class="links-section" aria-labelledby="linksHeading">
        <div class="section-heading">
          <h2 id="linksHeading">常用收藏</h2>
          <span id="resultCount">0 个链接</span>
        </div>
        <div class="link-grid" id="linkGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" hidden>
          <span aria-hidden="true">✦</span>
          <h3>这里还很安静</h3>
          <p>换一个关键词，或添加一个新的收藏。</p>
        </div>
      </section>
    </main>

    <footer>
      <span>LOCAL FIRST</span>
      <p>你的收藏保存在这台设备的 MongoDB 中。</p>
    </footer>

    <dialog id="linkDialog">
      <form method="dialog" id="linkForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">收藏一个入口</p>
            <h2 id="dialogTitle">添加链接</h2>
          </div>
          <button class="close-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="linkId" />
        <label>
          <span>名称</span>
          <input id="titleInput" name="title" required maxlength="80" placeholder="例如：我的工作台" />
        </label>
        <label>
          <span>网址</span>
          <input id="urlInput" name="url" required type="url" placeholder="https://example.com" />
        </label>
        <div class="form-row">
          <label>
            <span>分类</span>
            <input id="categoryInput" name="category" maxlength="30" placeholder="效率" />
          </label>
          <label>
            <span>色彩</span>
            <select id="colorInput" name="color">
              <option value="blue">海蓝</option>
              <option value="violet">紫罗兰</option>
              <option value="cyan">青绿</option>
              <option value="pink">玫红</option>
              <option value="amber">琥珀</option>
              <option value="red">珊瑚红</option>
              <option value="slate">石墨</option>
              <option value="indigo">靛蓝</option>
            </select>
          </label>
        </div>
        <label>
          <span>备注</span>
          <input id="noteInput" name="note" maxlength="120" placeholder="一句话描述它的用途" />
        </label>
        <p class="form-error" id="formError" role="alert"></p>
        <div class="dialog-actions">
          <button class="text-button danger" id="deleteButton" type="button" hidden>删除</button>
          <span class="spacer"></span>
          <button class="text-button" value="cancel" type="submit">取消</button>
          <button class="primary-button" id="saveButton" type="button">保存链接</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
